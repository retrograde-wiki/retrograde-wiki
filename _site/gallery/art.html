<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/root.css">
  <link rel="icon" href="/im/favicon.png" />
  <script src="/style/hover.js"></script>
  <title>RETROGRADE - ART</title>
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="/header.js"></script>

  <div class="art-page">
    <div class="lore-header">
      <h1 class="lore-title">Art</h1>
      <p class="intro-subtitle">Full illustrations</p>
    </div>

    

    
    <div class="art-grid masonry">
      
      <figure class="art-item">
        <img src="/im/art/zheng_fashion.png" data-full="/im/art/zheng_fashion.png" alt="Zheng Fashion" loading="lazy">
        
        <figcaption class="art-caption">Zheng Fashion</figcaption>
      </figure>
      
      <figure class="art-item">
        <img src="/im/art/zheng_food.png" data-full="/im/art/zheng_food.png" alt="Zheng Food" loading="lazy">
        <a class="art-source" href="https://example.com/original" target="_blank" rel="noopener" title="Source"><i class="fa-solid fa-link"></i></a>
        <figcaption class="art-caption">Zheng Food</figcaption>
      </figure>
      
    </div>
    
  </div>
</body>
</html>
