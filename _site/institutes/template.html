<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/style/style.css">
  <link rel="icon" href="/im/favicon.png" />
  <script src="/style/hover.js"></script>
  <title>RETROGRADE - </title>
  <style>
    :root {
      --charcolor: var(--grey);
      --hl-color: var(--hl-grey);
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="/header.js"></script>

  <div class="lore-container mono-page">
    <div class="lore-header">
      <h1 class="lore-title"></h1>
      
      
    </div>

    
    <div class="mono-images">
      <div class="mono-logo"><img src="/im/logos/company/aquaflo.png" alt=" logo"></div>
      <div class="mono-art"><img src="/im/art/monoliths/aquaflo.png" alt=""></div>
    </div>
    

    
    <div class="lore-toc">
      <div class="lore-toc-header" onclick="toggleMonoTOC()">
        <span class="lore-toc-title">Contents</span>
        <span class="lore-toc-toggle" id="mono-toc-toggle">[hide]</span>
      </div>
      <ol class="lore-toc-list" id="mono-toc-list"></ol>
    </div>
    

    <div class="lore-section mono-body zone-body">
      <h2>OVERVIEW</h2>
<h2>HISTORY</h2>
<h2>STRUCTURE</h2>
<h2>CULTURE</h2>
<h2>RELATIONSHIPS</h2>
<h3>Other Monoliths</h3>
<h3>Rho</h3>
<h3>The Talora</h3>
<h2>WORKING FOR AQUAFLO</h2>
<h2>NOTES</h2>

    </div>
  </div>

  
  <script>
    var list = document.getElementById('mono-toc-list');
    var used = {};
    document.querySelectorAll('.mono-body h2').forEach(function (h) {
      var id = h.id || h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (used[id]) { used[id]++; id = id + '-' + used[id]; } else { used[id] = 1; }
      h.id = id;
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      li.appendChild(a);
      list.appendChild(li);
    });
    function toggleMonoTOC() {
      var t = document.getElementById('mono-toc-toggle');
      var hidden = list.style.display === 'none';
      list.style.display = hidden ? 'block' : 'none';
      t.textContent = hidden ? '[hide]' : '[show]';
    }
  </script>
  
  <script src="/style/zone.js"></script>
</body>
</html>
